<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Barmaan Game</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
min-height:100vh;
}

#app{
width:min(92%,520px);
margin:auto;
padding:25px 0;
text-align:center;
}

h1{
font-size:34px;
margin:10px 0;
}

h2{
font-size:26px;
}

.score{
font-size:20px;
margin:15px 0 25px;
}

button{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:12px;
font-size:19px;
cursor:pointer;
}

.menu button{
background:#fff;
color:#111;
}

.uiButton{
background:#222;
color:#fff;
border:1px solid #555;
}

.scienceButton{
background:#16833b;
color:#fff;
}

.hardMathButton{
background:#c62828;
color:#fff;
}

.locked{
opacity:.45;
cursor:not-allowed;
}

.game{
display:none;
}

.question{
font-size:30px;
margin:25px 0;
}

input{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #555;
background:#222;
color:#fff;
font-size:20px;
text-align:center;
}

.answer{
background:#fff;
color:#111;
}

.hint{
background:#444;
color:#fff;
}

.back{
background:#333;
color:#fff;
}

.message{
min-height:28px;
margin:12px 0;
}

.redeemBox{
display:none;
margin-top:25px;
padding:20px;
border-radius:15px;
background:#1d1d1d;
}

.code{
font-size:34px;
font-weight:bold;
letter-spacing:5px;
margin:20px 0;
}

#redeemButton{
background:#777;
color:#aaa;
cursor:not-allowed;
}

#redeemButton.active{
background:#fff;
color:#111;
cursor:pointer;
}

#scienceGame .hint{
background:#444;
color:#fff;
}

#hardMathGame .hint{
background:#444;
color:#fff;
}
</style>
</head>

<body>

<div id="app">

<h1>Barmaan Game</h1>

<div class="score">
Score: <span id="score">0</span>
</div>

<div id="home">

<button class="uiButton" onclick="showUI()">
دریافت رابط کاربری barmaan vebs
</button>

<div class="menu">
<button onclick="startMath()">Math</button>
<button onclick="startWord()">Word</button>
<button
id="scienceButton"
class="scienceButton"
onclick="startScience()">
Science
</button>
<button
id="hardMathButton"
class="hardMathButton"
onclick="startHardMath()">
Hard Math
</button>
</div>

</div>

<div id="uiPage" class="game">

<h2>Barmaan Vebs UI</h2>

<button id="redeemButton" onclick="redeem()">
Redeem
</button>

<div id="redeemBox" class="redeemBox">

<div>Redeem Code:</div>

<div class="code">125736</div>

</div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="mathGame" class="game">

<h2>Math</h2>

<div class="question" id="mathQuestion"></div>

<input
id="mathAnswer"
type="number"
inputmode="decimal"
placeholder="جواب را بنویسید"
>

<button class="answer" onclick="checkMath()">
Answer
</button>

<button class="hint" onclick="mathHint()">
Hint (-45)
</button>

<div class="message" id="mathMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="wordGame" class="game">

<h2>Word</h2>

<div class="question" id="wordQuestion"></div>

<input
id="wordAnswer"
type="text"
autocomplete="off"
placeholder="معنی را بنویسید"
>

<button class="answer" onclick="checkWord()">
Answer
</button>

<button class="hint" onclick="wordHint()">
Hint (-45)
</button>

<div class="message" id="wordMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="scienceGame" class="game">

<h2>Science</h2>

<div class="question" id="scienceQuestion"></div>

<input
id="scienceAnswer"
type="text"
autocomplete="off"
placeholder="جواب را بنویسید"
>

<button class="answer" onclick="checkScience()">
Answer
</button>

<button class="hint" onclick="scienceHint()">
Hint (-50)
</button>

<div class="message" id="scienceMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="hardMathGame" class="game">

<h2>Hard Math</h2>

<div class="question" id="hardMathQuestion"></div>

<input
id="hardMathAnswer"
type="number"
inputmode="decimal"
placeholder="جواب را بنویسید"
>

<button class="answer" onclick="checkHardMath()">
Answer
</button>

<button class="hint" onclick="hardMathHint()">
Hint (-75)
</button>

<div class="message" id="hardMathMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

</div>

<script>
"use strict";

const SCORE_KEY="barmaan_game_score";

let score=Number(localStorage.getItem(SCORE_KEY)||0);

let mathAnswerCorrect=0;
let wordAnswerCorrect="";
let currentWord="";

let scienceAnswerCorrect="";
let currentScience="";

let hardMathAnswerCorrect=0;
let hardMathOperation="";

const home=document.getElementById("home");
const uiPage=document.getElementById("uiPage");
const mathGame=document.getElementById("mathGame");
const wordGame=document.getElementById("wordGame");
const scienceGame=document.getElementById("scienceGame");
const hardMathGame=document.getElementById("hardMathGame");

const scoreElement=document.getElementById("score");

const mathQuestion=document.getElementById("mathQuestion");
const mathAnswer=document.getElementById("mathAnswer");
const mathMessage=document.getElementById("mathMessage");

const wordQuestion=document.getElementById("wordQuestion");
const wordAnswer=document.getElementById("wordAnswer");
const wordMessage=document.getElementById("wordMessage");

const scienceQuestion=document.getElementById("scienceQuestion");
const scienceAnswer=document.getElementById("scienceAnswer");
const scienceMessage=document.getElementById("scienceMessage");

const hardMathQuestion=document.getElementById("hardMathQuestion");
const hardMathAnswer=document.getElementById("hardMathAnswer");
const hardMathMessage=document.getElementById("hardMathMessage");

const redeemButton=document.getElementById("redeemButton");
const redeemBox=document.getElementById("redeemBox");

const scienceButton=document.getElementById("scienceButton");
const hardMathButton=document.getElementById("hardMathButton");

const words=[
["خانه","محل زندگی"],
["کتاب","مجموعه‌ای از نوشته‌ها"],
["آب","مایعی که برای نوشیدن استفاده می‌شود"],
["درخت","گیاهی دارای تنه و شاخه"],
["خورشید","ستاره‌ای که زمین به دور آن می‌چرخد"],
["ماه","جرم آسمانی که به دور زمین می‌گردد"],
["سیب","یک میوه"],
["موز","یک میوه زرد"],
["مدرسه","محل آموزش"],
["رایانه","دستگاه الکترونیکی برای پردازش اطلاعات"],
["ماشین","وسیله نقلیه"],
["پرنده","جانوری که معمولاً بال دارد"],
["گربه","یک حیوان خانگی"],
["سگ","یک حیوان خانگی"],
["کتابخانه","محل نگهداری و مطالعه کتاب‌ها"]
];

const scienceQuestions=[
["آب در چند درجه سانتی‌گراد یخ می‌زند؟","0"],
["آب در سطح دریا در چند درجه سانتی‌گراد می‌جوشد؟","100"],
["سیاره‌ای که ما روی آن زندگی می‌کنیم چیست؟","زمین"],
["مرکز منظومه شمسی چیست؟","خورشید"],
["گیاهان برای فتوسنتز بیشتر از چه گازی استفاده می‌کنند؟","کربن دی اکسید"],
["انسان برای تنفس به چه گازی نیاز دارد؟","اکسیژن"],
["نیرویی که اجسام را به سمت زمین می‌کشد چیست؟","گرانش"],
["کدام اندام خون را در بدن پمپاژ می‌کند؟","قلب"],
["بزرگ‌ترین سیاره منظومه شمسی چیست؟","مشتری"],
["ماهواره طبیعی زمین چیست؟","ماه"],
["بدن انسان چند ریه دارد؟","2"],
["کدام بخش گیاه آب را از خاک جذب می‌کند؟","ریشه"],
["صدا برای انتشار به چه چیزی نیاز دارد؟","محیط"],
["نور خورشید چه نوع انرژی‌ای دارد؟","نور"],
["دما با چه وسیله‌ای اندازه‌گیری می‌شود؟","دماسنج"]
];

function updateScore(){

scoreElement.textContent=score;

localStorage.setItem(
SCORE_KEY,
score
);

if(score>=10000){

redeemButton.classList.add("active");

}else{

redeemButton.classList.remove("active");

}

if(score>=2000){

scienceButton.classList.remove("locked");

}else{

scienceButton.classList.add("locked");

}

if(score>=5000){

hardMathButton.classList.remove("locked");

}else{

hardMathButton.classList.add("locked");

}

}

function addScore(amount){

score+=amount;

updateScore();

}

function removeScore(amount){

score-=amount;

if(score<0){

score=0;

}

updateScore();

}

function hideGames(){

uiPage.style.display="none";
mathGame.style.display="none";
wordGame.style.display="none";
scienceGame.style.display="none";
hardMathGame.style.display="none";

}

function goHome(){

hideGames();

home.style.display="block";

redeemBox.style.display="none";

updateScore();

}

function showUI(){

home.style.display="none";
hideGames();

uiPage.style.display="block";

updateScore();

}

function redeem(){

if(score<10000){

return;

}

redeemBox.style.display="block";

}

function startMath(){

home.style.display="none";
hideGames();

mathGame.style.display="block";

newMathQuestion();

}

function newMathQuestion(){

const operators=["+","-","×","÷"];

const operator=
operators[
Math.floor(Math.random()*operators.length)
];

let a;
let b;

if(operator==="÷"){

b=Math.floor(Math.random()*12)+1;

const result=Math.floor(Math.random()*12)+1;

a=b*result;

mathAnswerCorrect=result;

}else{

a=Math.floor(Math.random()*50)+1;
b=Math.floor(Math.random()*50)+1;

if(operator==="+"){

mathAnswerCorrect=a+b;

}

if(operator==="-"){

if(b>a){

const temp=a;
a=b;
b=temp;

}

mathAnswerCorrect=a-b;

}

if(operator==="×"){

a=Math.floor(Math.random()*12)+1;
b=Math.floor(Math.random()*12)+1;

mathAnswerCorrect=a*b;

}

}

mathQuestion.textContent=
a+" "+operator+" "+b+" = ?";

mathAnswer.value="";
mathMessage.textContent="";

mathAnswer.focus();

}

function mathHint(){

if(score<45){

mathMessage.textContent=
"امتیاز کافی نداری! برای Hint حداقل 45 امتیاز لازم است.";

return;

}

removeScore(45);

let hintText="";

const question=
mathQuestion.textContent;

if(question.includes("+")){

hintText=
"راهنما: دو عدد را با هم جمع کن؛ حاصل باید از هر دو عدد بزرگ‌تر باشد.";

}

else if(question.includes("-")){

hintText=
"راهنما: عدد بزرگ‌تر را از عدد کوچک‌تر کم نکن؛ تفاضل عدد بزرگ‌تر و کوچک‌تر را پیدا کن.";

}

else if(question.includes("×")){

hintText=
"راهنما: ضرب را می‌توان با جمع تکراری انجام داد؛ عدد دوم را به تعداد عدد اول جمع کن.";

}

else if(question.includes("÷")){

hintText=
"راهنما: ببین عدد اول چند بار می‌تواند به اندازه عدد دوم تقسیم شود؛ جواب یک عدد صحیح است.";

}

mathMessage.textContent=hintText;

}

function checkMath(){

if(mathAnswer.value.trim()===""){

mathMessage.textContent="یک جواب وارد کنید.";

return;

}

const answer=Number(mathAnswer.value);

if(answer===mathAnswerCorrect){

addScore(10);

mathMessage.textContent=
"درست! +10 امتیاز 🎉";

setTimeout(
newMathQuestion,
700
);

}else{

mathMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

function startWord(){

home.style.display="none";
hideGames();

wordGame.style.display="block";

newWordQuestion();

}

function newWordQuestion(){

const item=
words[
Math.floor(Math.random()*words.length)
];

currentWord=item[0];

wordAnswerCorrect=item[1];

wordQuestion.textContent=
"معنی «"+item[0]+"» را بنویسید";

wordAnswer.value="";
wordMessage.textContent="";

wordAnswer.focus();

}

function wordHint(){

if(score<45){

wordMessage.textContent=
"امتیاز کافی نداری! برای Hint حداقل 45 امتیاز لازم است.";

return;

}

removeScore(45);

const hints={
"خانه":"جایی که انسان در آن زندگی می‌کند.",
"کتاب":"چیزی که آن را می‌خوانیم و داخلش نوشته و صفحه دارد.",
"آب":"مایعی شفاف و ضروری برای زندگی است.",
"درخت":"گیاهی است که معمولاً تنه و شاخه دارد.",
"خورشید":"ستاره‌ای است که به زمین نور و گرما می‌دهد.",
"ماه":"جرم آسمانی است که به دور زمین می‌گردد.",
"سیب":"میوه‌ای گرد است که معمولاً قرمز یا سبز است.",
"موز":"میوه‌ای زرد و کشیده است.",
"مدرسه":"جایی است که دانش‌آموزان در آن درس می‌خوانند.",
"رایانه":"دستگاهی الکترونیکی برای پردازش اطلاعات است.",
"ماشین":"وسیله‌ای برای جابه‌جایی انسان یا وسایل است.",
"پرنده":"جانوری است که معمولاً بال و پر دارد.",
"گربه":"حیوان خانگی‌ای است که معمولاً میو می‌کند.",
"سگ":"حیوان خانگی‌ای است که معمولاً پارس می‌کند.",
"کتابخانه":"جایی است که کتاب‌ها در آن نگهداری و مطالعه می‌شوند."
};

wordMessage.textContent=
"راهنما: "+hints[currentWord];

}

function checkWord(){

const answer=
wordAnswer.value
.trim()
.toLowerCase();

const correct=
wordAnswerCorrect
.trim()
.toLowerCase();

if(!answer){

wordMessage.textContent=
"معنی را بنویسید.";

return;

}

if(answer===correct){

addScore(50);

wordMessage.textContent=
"درست! +50 امتیاز 🎉";

setTimeout(
newWordQuestion,
700
);

}else{

wordMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

function startScience(){

if(score<2000){

scienceMessage.textContent=
"برای باز کردن Science حداقل 2,000 امتیاز لازم است.";

return;

}

home.style.display="none";
hideGames();

scienceGame.style.display="block";

newScienceQuestion();

}

function newScienceQuestion(){

const item=
scienceQuestions[
Math.floor(Math.random()*scienceQuestions.length)
];

currentScience=item[0];

scienceAnswerCorrect=item[1];

scienceQuestion.textContent=
item[0];

scienceAnswer.value="";
scienceMessage.textContent="";

scienceAnswer.focus();

}

function scienceHint(){

if(score<50){

scienceMessage.textContent=
"امتیاز کافی نداری! برای Hint حداقل 50 امتیاز لازم است.";

return;

}

removeScore(50);

const hints={

"آب در چند درجه سانتی‌گراد یخ می‌زند؟":
"راهنما: دمای یخ‌زدن آب یک عدد صفر است.",

"آب در سطح دریا در چند درجه سانتی‌گراد می‌جوشد؟":
"راهنما: این دما 100 درجه سانتی‌گراد است.",

"سیاره‌ای که ما روی آن زندگی می‌کنیم چیست؟":
"راهنما: نام آن با «ز» تمام می‌شود.",

"مرکز منظومه شمسی چیست؟":
"راهنما: یک ستاره است.",

"گیاهان برای فتوسنتز بیشتر از چه گازی استفاده می‌کنند؟":
"راهنما: این گاز را انسان‌ها بازدم می‌کنند.",

"انسان برای تنفس به چه گازی نیاز دارد؟":
"راهنما: این گاز بخش مهمی از هوای اطراف ماست.",

"نیرویی که اجسام را به سمت زمین می‌کشد چیست؟":
"راهنما: باعث می‌شود اجسام روی زمین بمانند.",

"کدام اندام خون را در بدن پمپاژ می‌کند؟":
"راهنما: این اندام در قفسه سینه قرار دارد.",

"بزرگ‌ترین سیاره منظومه شمسی چیست؟":
"راهنما: نام آن مشتری است.",

"ماهواره طبیعی زمین چیست؟":
"راهنما: شب‌ها در آسمان دیده می‌شود.",

"بدن انسان چند ریه دارد؟":
"راهنما: انسان معمولاً دو عدد از این اندام دارد.",

"کدام بخش گیاه آب را از خاک جذب می‌کند؟":
"راهنما: این بخش معمولاً در زیر خاک قرار دارد.",

"صدا برای انتشار به چه چیزی نیاز دارد؟":
"راهنما: صدا بدون یک بستر برای انتشار حرکت نمی‌کند.",

"نور خورشید چه نوع انرژی‌ای دارد؟":
"راهنما: چیزی است که با چشم می‌بینیم.",

"دما با چه وسیله‌ای اندازه‌گیری می‌شود؟":
"راهنما: وسیله‌ای برای اندازه‌گیری دماست."
};

scienceMessage.textContent=
hints[currentScience]||"راهنما: به مفهوم اصلی سؤال فکر کن.";

}

function checkScience(){

const answer=
scienceAnswer.value
.trim()
.toLowerCase();

const correct=
scienceAnswerCorrect
.trim()
.toLowerCase();

if(!answer){

scienceMessage.textContent=
"جواب را بنویسید.";

return;

}

if(answer===correct){

addScore(75);

scienceMessage.textContent=
"درست! +75 امتیاز 🎉";

setTimeout(
newScienceQuestion,
700
);

}else{

scienceMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

function startHardMath(){

if(score<5000){

hardMathMessage.textContent=
"برای باز کردن Hard Math حداقل 5,000 امتیاز لازم است.";

return;

}

home.style.display="none";
hideGames();

hardMathGame.style.display="block";

newHardMathQuestion();

}

function newHardMathQuestion(){

const operator=
Math.random()<0.5?"×":"÷";

let a;
let b;

if(operator==="×"){

a=Math.floor(Math.random()*91)+10;
b=Math.floor(Math.random()*41)+10;

hardMathAnswerCorrect=a*b;

}else{

b=Math.floor(Math.random()*31)+2;

const result=
Math.floor(Math.random()*31)+2;

a=b*result;

hardMathAnswerCorrect=result;

}

hardMathOperation=operator;

hardMathQuestion.textContent=
a+" "+operator+" "+b+" = ?";

hardMathAnswer.value="";
hardMathMessage.textContent="";

hardMathAnswer.focus();

}

function hardMathHint(){

if(score<75){

hardMathMessage.textContent=
"امتیاز کافی نداری! برای Hint حداقل 75 امتیاز لازم است.";

return;

}

removeScore(75);

const question=
hardMathQuestion.textContent;

if(question.includes("×")){

hardMathMessage.textContent=
"راهنما: ضرب را به چند قسمت تقسیم کن و حاصل قسمت‌ها را با هم جمع کن.";

}

else{

hardMathMessage.textContent=
"راهنما: عدد اول را بر عدد دوم تقسیم کن؛ جواب یک عدد صحیح است.";

}

}

function checkHardMath(){

if(hardMathAnswer.value.trim()===""){

hardMathMessage.textContent=
"یک جواب وارد کنید.";

return;

}

const answer=
Number(hardMathAnswer.value);

if(answer===hardMathAnswerCorrect){

addScore(150);

hardMathMessage.textContent=
"درست! +150 امتیاز 🎉";

setTimeout(
newHardMathQuestion,
700
);

}else{

hardMathMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

scienceAnswer.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

checkScience();

}

});

hardMathAnswer.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

checkHardMath();

}

});

mathAnswer.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

checkMath();

}

});

wordAnswer.addEventListener(
"keydown",
