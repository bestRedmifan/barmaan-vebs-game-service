<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Barmaan Game</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
min-height:100vh;
}

#app{
width:min(92%,520px);
margin:auto;
padding:25px 0;
text-align:center;
}

h1{
font-size:34px;
margin:10px 0;
}

h2{
font-size:26px;
}

.score{
font-size:20px;
margin:15px 0 25px;
}

button{
width:100%;
padding:15px;
margin:7px 0;
border:0;
border-radius:12px;
font-size:19px;
cursor:pointer;
}

.menu button{
background:#fff;
color:#111;
}

.uiButton{
background:#222;
color:#fff;
border:1px solid #555;
}

.game{
display:none;
}

.question{
font-size:30px;
margin:25px 0;
}

input{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #555;
background:#222;
color:#fff;
font-size:20px;
text-align:center;
}

.answer{
background:#fff;
color:#111;
}

.back{
background:#333;
color:#fff;
}

.message{
min-height:28px;
margin:12px 0;
}

.redeemBox{
display:none;
margin-top:25px;
padding:20px;
border-radius:15px;
background:#1d1d1d;
}

.code{
font-size:34px;
font-weight:bold;
letter-spacing:5px;
margin:20px 0;
}

#redeemButton{
background:#777;
color:#aaa;
cursor:not-allowed;
}

#redeemButton.active{
background:#fff;
color:#111;
cursor:pointer;
}
</style>
</head>

<body>

<div id="app">

<h1>Barmaan Game</h1>

<div class="score">
Score: <span id="score">0</span>
</div>

<div id="home">

<button class="uiButton" onclick="showUI()">
دریافت رابط کاربری barmaan vebs
</button>

<div class="menu">
<button onclick="startMath()">Math</button>
<button onclick="startWord()">Word</button>
</div>

</div>

<div id="uiPage" class="game">

<h2>Barmaan Vebs UI</h2>

<button id="redeemButton" onclick="redeem()">
Redeem
</button>

<div id="redeemBox" class="redeemBox">

<div>Redeem Code:</div>

<div class="code">125736</div>

</div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="mathGame" class="game">

<h2>Math</h2>

<div class="question" id="mathQuestion"></div>

<input
id="mathAnswer"
type="number"
inputmode="decimal"
placeholder="جواب را بنویسید"
>

<button class="answer" onclick="checkMath()">
Answer
</button>

<div class="message" id="mathMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

<div id="wordGame" class="game">

<h2>Word</h2>

<div class="question" id="wordQuestion"></div>

<input
id="wordAnswer"
type="text"
autocomplete="off"
placeholder="معنی را بنویسید"
>

<button class="answer" onclick="checkWord()">
Answer
</button>

<div class="message" id="wordMessage"></div>

<button class="back" onclick="goHome()">
Back
</button>

</div>

</div>

<script>
"use strict";

const SCORE_KEY="barmaan_game_score";

let score=Number(localStorage.getItem(SCORE_KEY)||0);

let mathAnswerCorrect=0;
let wordAnswerCorrect="";

const home=document.getElementById("home");
const uiPage=document.getElementById("uiPage");
const mathGame=document.getElementById("mathGame");
const wordGame=document.getElementById("wordGame");

const scoreElement=document.getElementById("score");

const mathQuestion=document.getElementById("mathQuestion");
const mathAnswer=document.getElementById("mathAnswer");
const mathMessage=document.getElementById("mathMessage");

const wordQuestion=document.getElementById("wordQuestion");
const wordAnswer=document.getElementById("wordAnswer");
const wordMessage=document.getElementById("wordMessage");

const redeemButton=document.getElementById("redeemButton");
const redeemBox=document.getElementById("redeemBox");

const words=[
["خانه","محل زندگی"],
["کتاب","مجموعه‌ای از نوشته‌ها"],
["آب","مایعی که برای نوشیدن استفاده می‌شود"],
["درخت","گیاهی دارای تنه و شاخه"],
["خورشید","ستاره‌ای که زمین به دور آن می‌چرخد"],
["ماه","جرم آسمانی که به دور زمین می‌گردد"],
["سیب","یک میوه"],
["موز","یک میوه زرد"],
["مدرسه","محل آموزش"],
["رایانه","دستگاه الکترونیکی برای پردازش اطلاعات"],
["ماشین","وسیله نقلیه"],
["پرنده","جانوری که معمولاً بال دارد"],
["گربه","یک حیوان خانگی"],
["سگ","یک حیوان خانگی"],
["کتابخانه","محل نگهداری و مطالعه کتاب‌ها"]
];

function updateScore(){

scoreElement.textContent=score;

localStorage.setItem(
SCORE_KEY,
score
);

if(score>=10000){

redeemButton.classList.add("active");

}else{

redeemButton.classList.remove("active");

}

}

function addScore(amount){

score+=amount;

updateScore();

}

function hideGames(){

uiPage.style.display="none";
mathGame.style.display="none";
wordGame.style.display="none";

}

function goHome(){

hideGames();

home.style.display="block";

redeemBox.style.display="none";

}

function showUI(){

home.style.display="none";
hideGames();

uiPage.style.display="block";

updateScore();

}

function redeem(){

if(score<10000){

return;

}

redeemBox.style.display="block";

}

function startMath(){

home.style.display="none";
hideGames();

mathGame.style.display="block";

newMathQuestion();

}

function newMathQuestion(){

const operators=["+","-","×","÷"];

const operator=
operators[
Math.floor(Math.random()*operators.length)
];

let a;
let b;

if(operator==="÷"){

b=Math.floor(Math.random()*12)+1;

const result=Math.floor(Math.random()*12)+1;

a=b*result;

mathAnswerCorrect=result;

}else{

a=Math.floor(Math.random()*50)+1;
b=Math.floor(Math.random()*50)+1;

if(operator==="+"){

mathAnswerCorrect=a+b;

}

if(operator==="-"){

if(b>a){

const temp=a;
a=b;
b=temp;

}

mathAnswerCorrect=a-b;

}

if(operator==="×"){

a=Math.floor(Math.random()*12)+1;
b=Math.floor(Math.random()*12)+1;

mathAnswerCorrect=a*b;

}

}

mathQuestion.textContent=
a+" "+operator+" "+b+" = ?";

mathAnswer.value="";
mathMessage.textContent="";

mathAnswer.focus();

}

function checkMath(){

if(mathAnswer.value.trim()===""){

mathMessage.textContent="یک جواب وارد کنید.";

return;

}

const answer=Number(mathAnswer.value);

if(answer===mathAnswerCorrect){

addScore(10);

mathMessage.textContent=
"درست! +10 امتیاز 🎉";

setTimeout(
newMathQuestion,
700
);

}else{

mathMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

function startWord(){

home.style.display="none";
hideGames();

wordGame.style.display="block";

newWordQuestion();

}

function newWordQuestion(){

const item=
words[
Math.floor(Math.random()*words.length)
];

wordAnswerCorrect=item[1];

wordQuestion.textContent=
"معنی «"+item[0]+"» را بنویسید";

wordAnswer.value="";
wordMessage.textContent="";

wordAnswer.focus();

}

function checkWord(){

const answer=
wordAnswer.value
.trim()
.toLowerCase();

const correct=
wordAnswerCorrect
.trim()
.toLowerCase();

if(!answer){

wordMessage.textContent=
"معنی را بنویسید.";

return;

}

if(answer===correct){

addScore(5);

wordMessage.textContent=
"درست! +5 امتیاز 🎉";

setTimeout(
newWordQuestion,
700
);

}else{

wordMessage.textContent=
"غلطه! دوباره امتحان کن.";

}

}

mathAnswer.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

checkMath();

}

});

wordAnswer.addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

checkWord();

}

});

updateScore();

if("serviceWorker" in navigator){

window.addEventListener(
"load",
function(){

navigator.serviceWorker.register("sw.js")
.catch(
function(error){

console.log(
"Service Worker error:",
error
);

});

});

}
</script>

</body>
  </html>
